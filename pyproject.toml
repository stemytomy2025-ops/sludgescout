[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sludgescout"
version = "0.1.0"
description = "SludgeScout: Streamlit + Claude tool-using agent on real public data."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "streamlit>=1.40",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sludgescout"]
